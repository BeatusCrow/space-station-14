name: Build and Package (Public Repo - No Source)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'
      - 'v*.*.*-*'
  pull_request:
    branches: [ main, master ]
    types: [ closed ]

concurrency:
  group: build-and-package
  cancel-in-progress: true

jobs:
  build-and-package:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read

    steps:
    - name: Install system dependencies
      run: sudo apt-get update && sudo apt-get install -y python3-paramiko python3-lxml

    # 1. Клонирование (без токенов, так как репозиторий публичный)
    - name: Checkout repository
      uses: actions/checkout@v4.2.2
      with:
        submodules: false

    # 2. Если есть публичные подмодули, инициализируем их
    - name: Setup submodules (if any)
      run: |
        if [ -f ".gitmodules" ]; then
          git submodule update --init --recursive
          echo "Submodules status:"
          git submodule status
        else
          echo "No submodules found"
        fi

    - name: Setup .NET Core
      uses: actions/setup-dotnet@v4.1.0
      with:
        dotnet-version: 10.0.x

    - name: Get Engine Tag (if RobustToolbox exists)
      run: |
        if [ -d "RobustToolbox" ]; then
          cd RobustToolbox
          git fetch --depth=1
          echo "Engine version: $(git describe --tags --abbrev=0 2>/dev/null || echo 'unknown')"
        else
          echo "No RobustToolbox directory found"
        fi

    - name: Install dependencies
      run: dotnet restore

    - name: Build Packaging
      run: dotnet build Content.Packaging --configuration Release --no-restore /m

    # 3. Извлечение версии
    - name: Extract version
      id: version
      run: |
        if [[ "${{ github.ref }}" == refs/tags/* ]]; then
          VERSION=${GITHUB_REF#refs/tags/}
          VERSION=${VERSION#v}
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag_with_v=v${VERSION}" >> $GITHUB_OUTPUT
        elif [[ "${{ github.event_name }}" == "pull_request" && "${{ github.event.pull_request.merged }}" == "true" ]]; then
          echo "version=pr-${{ github.event.pull_request.number }}" >> $GITHUB_OUTPUT
          echo "tag_with_v=pr-${{ github.event.pull_request.number }}" >> $GITHUB_OUTPUT
        else
          echo "version=dev-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
          echo "tag_with_v=dev" >> $GITHUB_OUTPUT
        fi

    # 4. Сборка сервера (все платформы)
    - name: Package server (all platforms)
      run: |
        dotnet run --project Content.Packaging server \
          --platform win-x64 \
          --platform win-arm64 \
          --platform linux-x64 \
          --platform linux-arm64 \
          --platform osx-x64 \
          --platform osx-arm64 || \
        echo "Warning: Some platforms may have failed, continuing..."

    # 5. Сборка клиента (опционально)
    - name: Package client
      run: dotnet run --project Content.Packaging client --no-wipe-release || \
        echo "Client packaging skipped or failed"

    # 6. Определение структуры сборки
    - name: Locate build artifacts
      id: artifacts
      run: |
        if [ -d "./release" ]; then
          echo "build_root=./release" >> $GITHUB_OUTPUT
        elif [ -d "./bin" ]; then
          echo "build_root=./bin" >> $GITHUB_OUTPUT
        elif [ -d "./publish" ]; then
          echo "build_root=./publish" >> $GITHUB_OUTPUT
        else
          echo "build_root=./" >> $GITHUB_OUTPUT
        fi

        echo "Build root: ${{ env.build_root }}"
        if [ -d "${{ env.build_root }}" ]; then
          ls -la ${{ env.build_root }}
        else
          echo "Warning: Build root directory not found"
        fi

    # 7. Удаление исходного кода контент-папок из сборки
    - name: REMOVE CONTENT SOURCE CODE from build
      run: |
        BUILD_ROOT="${{ steps.artifacts.outputs.build_root }}"

        echo "========================================="
        echo "REMOVING CONTENT SOURCE CODE"
        echo "========================================="

        CONTENT_DIRS=(
          "Content.Server"
          "Content.Shared"
          "Content.Client"
          "Content.IntegrationTests"
          "Content.Tests"
          "Content.Packaging"
        )

        for dir in "${CONTENT_DIRS[@]}"; do
          echo "Searching for: $dir"
          find $BUILD_ROOT -type d -name "$dir" -exec rm -rf {} + 2>/dev/null || true
          find $BUILD_ROOT -name "$dir.csproj" -type f -delete 2>/dev/null || true
        done

        echo "Removing all .cs files..."
        find $BUILD_ROOT -name "*.cs" -type f -delete 2>/dev/null || true

        echo "Removing .csproj files..."
        find $BUILD_ROOT -name "*.csproj" -type f -delete 2>/dev/null || true

        echo "Removing .sln files..."
        find $BUILD_ROOT -name "*.sln" -type f -delete 2>/dev/null || true

        echo "Removing obj directories..."
        find $BUILD_ROOT -type d -name "obj" -exec rm -rf {} + 2>/dev/null || true

        echo "Cleaning up nested bin directories..."
        find $BUILD_ROOT -type d -name "bin" -not -path "$BUILD_ROOT" -exec rm -rf {} + 2>/dev/null || true

        echo ""
        echo "========================================="
        echo " CONTENT SOURCE CODE REMOVED"
        echo "========================================="

    # 8. Создание чистых архивов без исходного кода
    - name: Create clean archives (without source code)
      id: package
      run: |
        VERSION="${{ steps.version.outputs.version }}"
        BUILD_ROOT="${{ steps.artifacts.outputs.build_root }}"

        echo "Creating clean packages from: $BUILD_ROOT"

        if [ ! -d "$BUILD_ROOT" ]; then
          echo "Error: Build root directory not found!"
          exit 1
        fi

        cat > README_PACKAGE.md << 'EOF'
# Space Station 14 Server Package

## Package Contents
- Compiled binaries only (.dll files)
- No source code (Content.Server, Content.Shared, Content.Client removed)
- Ready to run on multiple platforms

## Quick Start
```bash
# Extract the package for your platform
tar -xzf ss14-server-linux-x64-${VERSION}.tar.gz
cd linux-x64
chmod +x run_server.sh
./run_server.sh
